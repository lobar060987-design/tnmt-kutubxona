<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E78">
<title>Kitob</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
<style>
body{background:var(--bg2)}
.rbar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top))}
.rbar h1{font:600 .98rem/1.2 var(--serif);margin:0 4px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar button,.rbar .btn{min-height:42px;width:42px;padding:0;border-radius:11px}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);width:0;transition:width .2s}
#pages{margin:0 auto;padding:12px 8px 96px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow-x:auto}
.page{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);overflow:hidden;flex:none;position:relative}
.page canvas{display:block}
.status{text-align:center;color:var(--muted);padding:60px 16px}
.status .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dock{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;display:flex;align-items:center;gap:2px;padding:4px;z-index:10}
.dock button{border:0;background:transparent;min-height:42px;width:42px;padding:0;border-radius:50%}
.dock .pn{display:flex;align-items:center;gap:4px;padding:0 6px;font-weight:600;font-variant-numeric:tabular-nums}
.dock input{width:52px;min-height:36px;padding:2px 4px;text-align:center;border-radius:10px}
:root[data-theme="dark"] .page canvas{filter:invert(.9) hue-rotate(180deg)}
.ow{display:none}
</style>
</head>
<body>
<div class="rbar">
  <a class="btn" href="/" aria-label="Orqaga"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
  <h1 id="title">Kitob ochilmoqda…</h1>
  <button type="button" id="zout" aria-label="Kichraytirish"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.500M8 11h6"/></svg></button>
  <button type="button" id="zin" aria-label="Kattalashtirish"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.500M8 11h6M11 8v6"/></svg></button>
  <a class="btn" id="dl" href="#" aria-label="Yuklab olish" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></a>
  <button type="button" data-theme-btn aria-label="Tun rejimi"></button>
  <div class="prog" id="prog"></div>
</div>
<div id="pages"><div class="status" id="status"><div class="spin"></div><span id="stt">Kitob ochilmoqda…</span></div></div>
<div class="dock" id="dock" hidden>
  <button type="button" id="prev" aria-label="Oldingi sahifa"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="pn"><label class="sr" for="pin">Sahifa raqami</label><input id="pin" inputmode="numeric" pattern="[0-9]*" value="1"> / <span id="tot">1</span></div>
  <button type="button" id="next" aria-label="Keyingi sahifa"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<script src="/vendor/pdf.min.js"></script>
<script src="/reader.js"></script>
</body>
</html>
