# Fly.io sozlamasi. "kutubxona-nomi" ni o'zingizning noyob nomingizga almashtiring.
app = "kutubxona-nomi"
primary_region = "fra"

[build]

[env]
  DATA_DIR = "/data"
  SITE_NAME = "Online kutubxona"

[[mounts]]
  source = "kutubxona_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
